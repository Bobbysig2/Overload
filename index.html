<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overload">
<title>Overload</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0a; --surface:#141414; --border:#1e1e1e;
    --accent:#e83535; --text:#f0f0f0; --muted:#555;
    --green:#4ade80; --orange:#ff6b35;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
  ::-webkit-scrollbar{display:none}
  .header{padding:20px 20px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);z-index:100}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:var(--accent)}
  .week-badge{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);border:1px solid var(--border);padding:4px 12px;border-radius:20px}
  .nav-tabs{display:flex;border-bottom:1px solid var(--border)}
  .nav-tab{flex:1;padding:12px 4px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);cursor:pointer;letter-spacing:1px;text-transform:uppercase;border-bottom:2px solid transparent}
  .nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .page{display:none}
  .page.active{display:block}
  .day-tabs{display:flex;gap:8px;padding:14px 20px;overflow-x:auto;border-bottom:1px solid var(--border)}
  .day-tab{flex-shrink:0;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
  .day-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
  .main{padding:20px 20px 110px}
  .day-title{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:2px;line-height:1}
  .day-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:4px;margin-bottom:20px}
  .stats{display:flex;gap:7px;margin-bottom:22px}
  /* rest timer */
  .rest-bar{position:fixed;left:0;right:0;bottom:76px;z-index:120;display:none;padding:0 14px}
  .rest-bar.on{display:block}
  .rest-inner{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.6)}
  .rest-time{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--accent);line-height:1;min-width:76px}
  .rest-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:2px}
  .rest-btn{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 11px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer}
  .rest-btn.skip{border-color:var(--accent);color:var(--accent)}
  .rest-prog{height:3px;background:var(--border);border-radius:3px;margin-top:9px;overflow:hidden}
  .rest-prog i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
  /* fill-down */
  .fill-btn{background:transparent;border:1px dashed #3a3a3a;color:var(--muted);border-radius:7px;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer;letter-spacing:.5px}
  .fill-btn:active{border-color:var(--accent);color:var(--accent)}
  .prev-line{font-family:'JetBrains Mono',monospace;font-size:10px;color:#6a6a6a;margin-bottom:10px}
  .card-meta u{text-decoration:underline dotted;text-underline-offset:2px}
  .prev-line b{color:#8a8a8a;font-weight:400}
  /* body tab */
  .bw-hero{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
  .bw-now{font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:1;color:var(--text)}
  .bw-unit{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);margin-left:6px}
  .bw-goalbar{height:8px;background:var(--border);border-radius:8px;margin:16px 0 8px;overflow:hidden}
  .bw-goalfill{height:100%;background:linear-gradient(90deg,#e83535,#ff6b35);border-radius:8px;transition:width .4s}
  .bw-ends{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
  .bw-form{display:flex;gap:8px;margin-bottom:16px}
  .bw-in{flex:1;background:var(--bg);border:1px solid #2a2a2a;border-radius:8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;padding:11px;outline:none;text-align:center;min-width:0}
  .bw-in:focus{border-color:var(--accent)}
  .bw-log-btn{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:0 18px;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1px;cursor:pointer}
  .bw-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:9px;margin-bottom:7px}
  .bw-row-w{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600}
  .bw-row-bf{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--orange);margin-left:9px}
  .bw-row-d{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
  .bw-del{background:transparent;border:none;color:#5a2020;font-size:15px;cursor:pointer;padding:0 0 0 10px}
  .spark{width:100%;height:88px;margin-top:6px}
  .stat{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 4px;text-align:center}
  .stat-val{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);line-height:1}
  .stat-label{font-family:'JetBrains Mono',monospace;font-size:8.5px;white-space:nowrap;color:var(--muted);margin-top:3px;letter-spacing:1px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .card.all-done{border-color:var(--green);opacity:.75}
  .card-header{display:flex;align-items:center;justify-content:space-between;padding:14px;cursor:pointer;user-select:none}
  .card-name{font-size:15px;font-weight:600}
  .card-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-top:2px}
  .card-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .wt-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;background:var(--accent);color:#fff;padding:2px 8px;border-radius:4px}
  .del-btn{width:26px;height:26px;border-radius:6px;border:1px solid #2a1010;background:transparent;color:#f87171;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .chevron{color:var(--muted);font-size:10px;display:inline-block;transition:transform .2s}
  .card-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}
  .card.open .card-body{display:block}
  .card.open .chevron{transform:rotate(180deg)}
  .prog-bar{background:var(--border);border-radius:4px;height:3px;margin:10px 0 14px;overflow:hidden}
  .prog-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
  .prog-hint{background:#1a2a1a;border:1px solid #2a4a2a;border-radius:8px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .prog-hint-text{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--green)}
  .input-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px}
  .row-flex{display:flex;gap:14px;margin-bottom:14px;align-items:flex-end}
  .weight-input{width:90px;background:var(--bg);border:1px solid #2a2a2a;border-radius:6px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;padding:8px 12px;outline:none}
  .sets-adjust{display:flex;align-items:center;gap:10px}
  .adj-btn{width:30px;height:30px;border-radius:6px;border:1px solid #2a2a2a;background:var(--bg);color:var(--text);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .adj-count{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;min-width:20px;text-align:center}
  .sets-hdr{display:grid;grid-template-columns:22px 52px 1fr 1fr 30px;gap:8px;font-family:'JetBrains Mono',monospace;font-size:9px;color:#444;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  .set-row{display:grid;grid-template-columns:22px 52px 1fr 1fr 30px;gap:8px;align-items:center;margin-bottom:8px}
  .set-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:#444;text-align:center}
  .set-target{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
  .reps-input{background:var(--bg);border:1px solid #2a2a2a;border-radius:6px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;padding:7px 8px;outline:none;text-align:center;width:100%}
  .check-btn{width:30px;height:30px;border-radius:6px;border:1px solid #2a2a2a;background:transparent;color:transparent;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto;cursor:pointer}
  .check-btn.done{border-color:var(--green);background:var(--green);color:#000}
  .subs-section{margin-top:12px;border-top:1px dashed #222;padding-top:12px}
  .subs-title{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:8px}
  .sub-chip{display:inline-block;background:var(--bg);border:1px solid #2a2a2a;color:var(--text);font-size:12px;padding:6px 12px;border-radius:20px;margin:0 6px 6px 0;cursor:pointer}
  .sub-chip:active{border-color:var(--accent)}
  .sub-add{display:inline-block;background:transparent;border:1px dashed #2a2a2a;color:var(--muted);font-size:12px;padding:6px 12px;border-radius:20px;margin:0 6px 6px 0;cursor:pointer}
  .last-session{margin-top:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
  .last-wt{font-family:'Bebas Neue',sans-serif;font-size:18px}
  .last-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:#444;margin-top:2px}
  .last-date{font-family:'JetBrains Mono',monospace;font-size:10px;color:#444}
  .add-ex-btn{width:100%;padding:14px;border-radius:12px;border:1px dashed #2a2a2a;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:12px}
  .bottom-bar{position:fixed;bottom:0;left:0;right:0;padding:14px 20px;background:var(--bg);border-top:1px solid var(--border);display:flex;gap:10px;z-index:50}
  .btn{padding:14px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none}
  .btn-sec{flex:1;background:var(--surface);color:var(--text);border:1px solid var(--border)}
  .btn-pri{flex:2;background:var(--accent);color:#fff}
  .login-screen{position:fixed;inset:0;background:var(--bg);z-index:900;display:none;align-items:center;justify-content:center;padding:24px}
  .login-screen.on{display:flex}
  .login-box{width:100%;max-width:380px}
  .login-logo{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:5px;color:var(--accent);text-align:center;line-height:1}
  .login-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:3px;text-align:center;margin:8px 0 28px}
  .prof-chip{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:15px 17px;margin-bottom:9px;cursor:pointer}
  .prof-chip:active{border-color:var(--accent)}
  .prof-name{font-size:16px;font-weight:600;text-transform:capitalize}
  .prof-go{color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px}
  .login-or{text-align:center;font-family:'JetBrains Mono',monospace;font-size:9px;color:#3a3a3a;letter-spacing:2px;margin:18px 0 12px}
  .login-btn{width:100%;background:var(--accent);border:none;color:#fff;border-radius:11px;padding:15px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer;margin-top:9px}
  .login-note{font-size:11px;color:#4a4a4a;text-align:center;margin-top:18px;line-height:1.5}
  .prof-badge{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);border:1px solid var(--border);padding:4px 10px;border-radius:20px;cursor:pointer;text-transform:capitalize}
  .prof-badge:active{border-color:var(--accent);color:var(--accent)}
  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--accent);color:#fff;font-weight:700;font-size:13px;padding:10px 22px;border-radius:30px;z-index:999;white-space:nowrap;opacity:0;transition:all .25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;align-items:flex-end;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal{background:var(--surface);border:1px solid #2a2a2a;border-radius:16px 16px 0 0;padding:24px 20px 44px;width:100%;max-width:600px}
  .modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;margin-bottom:16px}
  .modal-input{width:100%;background:var(--bg);border:1px solid #2a2a2a;border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:12px 14px;outline:none;margin-bottom:10px}
  .modal-actions{display:flex;gap:10px;margin-top:6px}
  .hist-week{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .hist-week-hdr{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .hist-week-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px}
  .hist-week-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
  .hist-week-body{display:none;border-top:1px solid var(--border)}
  .hist-week.open .hist-week-body{display:block}
  .hist-day{padding:12px 16px;border-bottom:1px solid var(--border)}
  .hist-day:last-child{border-bottom:none}
  .hist-day-title{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:8px;font-family:'JetBrains Mono',monospace}
  .hist-ex-row{padding:3px 0}
  .hist-ex-top{display:flex;justify-content:space-between}
  .hist-ex-name{font-size:12px}
  .hist-ex-stat{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
  .hist-ex-detail{font-family:'JetBrains Mono',monospace;font-size:10px;color:#5a5a5a;margin-top:1px}
  .empty{text-align:center;padding:60px 20px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);line-height:2}
  .loading{display:flex;align-items:center;justify-content:center;min-height:50vh;flex-direction:column;gap:12px}
  .spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:2px}
  .save-indicator{position:fixed;top:16px;right:70px;width:8px;height:8px;border-radius:50%;background:var(--muted);z-index:200;transition:background .3s}
  .save-indicator.saving{background:var(--orange)}
  .save-indicator.saved{background:var(--green)}
  /* CALENDAR */
  .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .cal-month{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px}
  .cal-nav{display:flex;gap:8px}
  .cal-nav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;cursor:pointer}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{text-align:center;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);padding:6px 0;letter-spacing:1px}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);border:1px solid transparent}
  .cal-day.in-month{color:var(--text);border-color:var(--border);background:var(--surface)}
  .cal-day.worked{background:var(--accent);color:#fff;font-weight:700;border-color:var(--accent)}
  .cal-day.today{border-color:var(--orange)}
  .cal-stats{margin-top:20px;display:flex;gap:10px}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">OVERLOAD</div>
    <div class="login-sub">WHO'S TRAINING?</div>
    <div id="profileList"></div>
    <input class="modal-input" id="newProfile" placeholder="Your name" maxlength="18" autocomplete="off">
    <button class="login-btn" onclick="createProfile()">START TRAINING</button>
    <div class="login-note">Your name keeps your lifts separate from everyone else using this app.</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="save-indicator" id="saveIndicator"></div>

<div class="header">
  <div class="logo">OVERLOAD</div>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="prof-badge" id="profBadge" onclick="switchProfile()">—</div>
    <div class="week-badge" id="weekBadge">WEEK 1</div>
  </div>
</div>
<div class="nav-tabs">
  <div class="nav-tab active" id="nav-workout" onclick="switchNav('workout')">WORKOUT</div>
  <div class="nav-tab" id="nav-calendar" onclick="switchNav('calendar')">CALENDAR</div>
  <div class="nav-tab" id="nav-history" onclick="switchNav('history')">HISTORY</div>
  <div class="nav-tab" id="nav-body" onclick="switchNav('body')">BODY</div>
</div>
<div class="page active" id="page-workout">
  <div class="day-tabs" id="dayTabs"></div>
  <div class="main" id="workoutMain">
    <div class="loading"><div class="spinner"></div><div class="loading-text">LOADING...</div></div>
  </div>
</div>
<div class="page" id="page-calendar">
  <div class="main" id="calendarMain"></div>
</div>
<div class="page" id="page-body">
  <div class="main" id="bodyMain"></div>
</div>
<div class="page" id="page-history">
  <div class="main" id="historyMain">
    <div class="empty">No workouts saved yet.</div>
  </div>
</div>
<div class="rest-bar" id="restBar">
  <div>
    <div class="rest-inner">
      <div>
        <div class="rest-lbl">REST</div>
        <div class="rest-time" id="restTime">1:30</div>
      </div>
      <div style="flex:1"></div>
      <button class="rest-btn" onclick="addRest(30)">+30s</button>
      <button class="rest-btn skip" onclick="stopRest()">SKIP</button>
    </div>
    <div class="rest-prog"><i id="restProg" style="width:100%"></i></div>
  </div>
</div>
<div class="bottom-bar" id="bottomBar">
  <button class="btn btn-sec" onclick="resetDay()">RESET</button>
  <button class="btn btn-pri" onclick="finishWorkout()">FINISH WORKOUT</button>
</div>
<div class="modal-overlay" id="promptModal">
  <div class="modal">
    <div class="modal-title" id="promptModalTitle">EDIT</div>
    <input class="modal-input" id="promptModalInput" />
    <div class="modal-actions">
      <button class="btn btn-sec" style="flex:1" onclick="closePromptModal()">CANCEL</button>
      <button class="btn btn-pri" style="flex:2" onclick="submitPromptModal()">SAVE</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <div class="modal-title" id="confirmModalTitle">Are you sure?</div>
    <div class="modal-actions">
      <button class="btn btn-sec" style="flex:1" onclick="closeConfirmModal()">CANCEL</button>
      <button class="btn btn-pri" style="flex:1;background:var(--accent)" onclick="submitConfirmModal()">YES</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">ADD EXERCISE</div>
    <input class="modal-input" id="newName" placeholder="Exercise name" />
    <input class="modal-input" id="newSets" type="number" placeholder="Sets (e.g. 3)" />
    <input class="modal-input" id="newReps" placeholder="Reps (e.g. 8-12)" />
    <div class="modal-actions">
      <button class="btn btn-sec" style="flex:1" onclick="closeModal()">CANCEL</button>
      <button class="btn btn-pri" style="flex:2" onclick="confirmAdd()">ADD</button>
    </div>

// ── WEEK ──────────────────────────────────────────────────────
function getThisSunday(){
  const d=new Date();
  d.setDate(d.getDate()-d.getDay());
  d.setHours(0,0,0,0);
  return d.getTime();
}
function checkWeekReset(){
  const thisSunday=getThisSunday();
  if(thisSunday>weekStart){
    archiveWeek();
    currentWeek+=Math.round((thisSunday-weekStart)/(7*24*60*60*1000));
    weekStart=thisSunday;
    resetAllSets();
    saveAll();
    showToast('🗓 New week!');

  document.getElementById('weekBadge').textContent='WEEK '+currentWeek;
}
function archiveWeek(){
  const entry={week:currentWeek,weekStart,days:[]};
  DAYS.forEach(day=>{
    const exs=[];
    (split[day]||[]).forEach(ex=>{
      const ed=(workoutData[day]||{})[ex.name];
      if(ed&&ed.sets&&ed.sets.some(s=>s.done)){
        exs.push({
          name:ex.name,
          weight:topWeight(ed)||0,
          setsDone:ed.sets.filter(s=>s.done).length,
          totalSets:ex.sets,
          allHit:ed.sets.every(s=>s.done),
          detail:ed.sets.filter(s=>s.done).map(s=>({weight:s.weight||'',reps:s.reps||''}))
        });
      }
    });
    if(exs.length>0)entry.days.push({day,exercises:exs});
  });
  if(entry.days.length>0){

      }

  });
}

// ── PROGRESSION (double progression, applied on Finish) ───────
function topOfRange(reps){
  const parts=String(reps).split('-');
  return parseInt(parts[parts.length-1])||12;
}
function evaluateProgression(day){
  // Double progression: ALL sets done AND every set's reps >= top of range
  // → each set's weight auto-bumps +5lb for next session
  const progressed=[];
  (split[day]||[]).forEach(ex=>{
    const ed=(workoutData[day]||{})[ex.name];
    if(!ed||!ed.sets||ed.sets.length===0)return;
    const allDone=ed.sets.every(s=>s.done);
    if(!allDone)return;
    const top=topOfRange(ex.reps);
    const allTopped=ed.sets.every(s=>parseInt(s.reps||0)>=top);
    if(allTopped&&ed.sets.some(s=>parseFloat(s.weight)>0)){
      ed.sets.forEach(s=>{
        if(parseFloat(s.weight)>0)s.weight=String(parseFloat(s.weight)+5);
      });
      ed.progressedThisWeek=true;
      progressed.push(ex.name);
    }
  });
  return progressed;
}



// ── DATA ──────────────────────────────────────────────────────
function makeSets(n,w){return Array.from({length:n},()=>({weight:w||'',reps:'',done:false}));}
function getExData(day,name,numSets){
  if(!workoutData[day])workoutData[day]={};
  if(!workoutData[day][name])workoutData[day][name]={sets:makeSets(numSets),history:[]};
  const ed=workoutData[day][name];
  // MIGRATION: old format had one ed.weight — copy it into every set
  if(ed.weight!==undefined){
    ed.sets.forEach(s=>{if(s.weight===undefined||s.weight==='')s.weight=ed.weight;});
    delete ed.weight;
  }
  ed.sets.forEach(s=>{if(s.weight===undefined)s.weight='';});
  while(ed.sets.length<numSets){
    const lastW=ed.sets.length>0?ed.sets[ed.sets.length-1].weight:'';
    ed.sets.push({weight:lastW,reps:'',done:false});
  }
  if(ed.sets.length>numSets)ed.sets=ed.sets.slice(0,numSets);
  return ed;
}

// ── REST TIMER ────────────────────────────────────────────────
let restSecs=0, restTotal=0, restInt=null;
let REST_DEFAULT=parseInt(localStorage.getItem('restDefault')||'90');

function startRest(secs){
  restTotal=secs||REST_DEFAULT; restSecs=restTotal;
  document.getElementById('restBar').classList.add('on');
  paintRest();
  clearInterval(restInt);
  restInt=setInterval(()=>{
    restSecs--;
    if(restSecs<=0){
      stopRest();
      buzz();
      showToast('⏱ Rest done — go');
      return;
    }
    paintRest();
  },1000);
}
function paintRest(){
  const m=Math.floor(restSecs/60), s=restSecs%60;
  document.getElementById('restTime').textContent=m+':'+String(s).padStart(2,'0');
  document.getElementById('restProg').style.width=(restSecs/restTotal*100)+'%';
}
function addRest(n){ if(restSecs>0){ restSecs+=n; restTotal+=n; paintRest(); } }
function stopRest(){
  clearInterval(restInt); restInt=null; restSecs=0;
  document.getElementById('restBar').classList.remove('on');
}
function buzz(){
  if(navigator.vibrate)navigator.vibrate([200,90,200]);
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    const ctx=new C(), o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value=880; o.type='sine';
    g.gain.setValueAtTime(.25,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.5);
    o.start(); o.stop(ctx.currentTime+.5);
  }catch(e){}
}

        if(document.visibilityState==='visible'&&'wakeLock' in navigator){

        }
      });
    }
  }catch(e){}
}

              <div class="set-num">${si+1}</div>
              <div class="set-target">${ex.reps}</div>
              <input class="reps-input" type="number" step="2.5" value="${set.weight||''}" placeholder="${(prevSets[si]&&prevSets[si].weight)||'lb'}"
                oninput="updateSetWeight('${esc(ex.name)}',${si},this.value)">
              <input class="reps-input" type="number" value="${set.reps||''}" placeholder="${(prevSets[si]&&prevSets[si].reps)||'—'}"
                oninput="updateReps('${esc(ex.name)}',${si},this.value)">
              <button class="check-btn ${set.done?'done':''}" onclick="toggleSet('${esc(ex.name)}',${si})">✓</button>
            </div>`).join('')}
          <div class="subs-section">
            <div class="subs-title">NO MACHINE? SWAP FOR:</div>
            ${(ex.subs||[]).map((s,sj)=>`<span class="sub-chip" onclick="swapExercise(${i},${sj})">${s}</span>`).join('')}
            <span class="sub-add" onclick="openSubModal(${i})">+ add substitute</span>
          </div>
          ${lastH?`
            <div class="last-session">
              <div><div class="last-wt">${lastH.weight}lb</div><div class="last-meta">${lastH.sets} sets done</div></div>
              <div class="last-date">${lastH.date}</div>
            </div>`:''}
        </div>
      </div>`;
  });

  html+=`<button class="add-ex-btn" onclick="openAddModal()">+ Add Exercise</button>`;
  document.getElementById('workoutMain').innerHTML=html;
}

function esc(s){return s.replace(/'/g,"\\'");}

// ── CUSTOM PROMPT / CONFIRM (native prompt()/confirm() are silently
// blocked on iOS when the app is added to the Home Screen — these
// on-screen modals work the same everywhere, standalone or not) ──
let _promptCB=null, _confirmCB=null;
function askText(title,defaultVal,cb){
  _promptCB=cb;
  document.getElementById('promptModalTitle').textContent=title;
  const inp=document.getElementById('promptModalInput');
  inp.value=defaultVal||'';
  document.getElementById('promptModal').classList.add('open');
  setTimeout(()=>{inp.focus();inp.select();},50);
}
function closePromptModal(){
  document.getElementById('promptModal').classList.remove('open');
  _promptCB=null;
}
function submitPromptModal(){
  const v=document.getElementById('promptModalInput').value;
  const cb=_promptCB;
  document.getElementById('promptModal').classList.remove('open');
  _promptCB=null;
  if(cb)cb(v);
}
function askConfirm(message,cb){
  _confirmCB=cb;
  document.getElementById('confirmModalTitle').textContent=message;
  document.getElementById('confirmModal').classList.add('open');
}
function closeConfirmModal(){
  document.getElementById('confirmModal').classList.remove('open');
  _confirmCB=null;
}
function submitConfirmModal(){
  const cb=_confirmCB;
  document.getElementById('confirmModal').classList.remove('open');
  _confirmCB=null;
  if(cb)cb();
}

function toggleCard(i,name){
  const key=currentDay+name;
  openCards[key]=openCards[key]===false;
  document.getElementById('card'+i).classList.toggle('open');
}
function updateSetWeight(name,si,val){
  const ed=getExData(currentDay,name,si+1);
  ed.sets[si].weight=val;
  debounceSave();
}
function topWeight(ed){
  if(!ed.sets||ed.sets.length===0)return '';
  const ws=ed.sets.map(s=>parseFloat(s.weight)||0).filter(w=>w>0);
  return ws.length?Math.max(...ws):'';
}
function updateReps(name,si,val){
  const ed=getExData(currentDay,name,si+1);
  ed.sets[si].reps=val;
  debounceSave();
}
function fillDown(name){
  const ed=getExData(currentDay,name,1);
  const w=ed.sets[0]&&ed.sets[0].weight;
  if(!w){showToast('Put a weight in set 1 first');return;}
  ed.sets.forEach(s=>{s.weight=w;});
  debounceSave();
  renderWorkout();
  showToast(w+'lb across all sets');
}
function toggleSet(name,si){
  const ed=getExData(currentDay,name,si+1);
  const nowDone=!ed.sets[si].done;
  ed.sets[si].done=nowDone;
  // auto-fill reps from the target if left blank, so a set is never lost
  debounceSave();
  if(nowDone)startRest(REST_DEFAULT); else stopRest();
  // auto-collapse the card once every set is finished — less scrolling
  if(nowDone&&ed.sets.every(s=>s.done))openCards[currentDay+name]=false;
  renderWorkout();
}
function editRepTarget(idx){
  const ex=(split[currentDay]||[])[idx];
  if(!ex)return;
  askText('REP TARGET · '+ex.name.toUpperCase(),ex.reps,(v)=>{
    const clean=(v||'').trim();
    if(!clean||!/^\d{1,3}(-\d{1,3})?$/.test(clean)){showToast('Use a number or range like 8-12');return;}
    ex.reps=clean;
    dbSet('split',split);
    renderWorkout();
    showToast('Target set to '+clean);
  });
}
function adjustSets(idx,delta){
  const ex=split[currentDay][idx];
  const newSets=Math.max(1,Math.min(10,ex.sets+delta));
  if(newSets===ex.sets)return;
  ex.sets=newSets;
  const ed=getExData(currentDay,ex.name,newSets);
  ed.sets=ed.sets.slice(0,newSets);
  while(ed.sets.length<newSets)ed.sets.push({reps:'',done:false});
  dbSet('split',split);
  debounceSave();
  renderWorkout();
}
function swapExercise(idx,subIdx){
  const ex=split[currentDay][idx];
  const subName=ex.subs[subIdx];
  askConfirm('Swap "'+ex.name+'" for "'+subName+'" today?',()=>{
    // swap: sub becomes main, old main goes into subs
    ex.subs[subIdx]=ex.name;
    ex.name=subName;
    dbSet('split',split);
    showToast('Swapped to '+subName);
    renderWorkout();
  });
}
function deleteEx(idx){
  const name=split[currentDay][idx].name;
  askConfirm('Remove "'+name+'" from '+currentDay+'?',()=>{
    split[currentDay].splice(idx,1);
    dbSet('split',split);
    showToast(name+' removed');
    renderWorkout();
  });
}

// ── MODALS ────────────────────────────────────────────────────
function openAddModal(){
  modalMode='add';
  document.getElementById('modalTitle').textContent='ADD EXERCISE';
  document.getElementById('newSets').style.display='block';
  document.getElementById('newReps').style.display='block';
  ['newName','newSets','newReps'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('addModal').classList.add('open');
  setTimeout(()=>document.getElementById('newName').focus(),100);
}
function openSubModal(idx){
  modalMode='sub';
  subTargetIdx=idx;
  document.getElementById('modalTitle').textContent='ADD SUBSTITUTE';
  document.getElementById('newSets').style.display='none';
  document.getElementById('newReps').style.display='none';
  document.getElementById('newName').value='';
  document.getElementById('addModal').classList.add('open');
  setTimeout(()=>document.getElementById('newName').focus(),100);
}
function closeModal(){document.getElementById('addModal').classList.remove('open');}
function confirmAdd(){
  const name=document.getElementById('newName').value.trim();
  if(!name)return;
  if(modalMode==='sub'){
    const ex=split[currentDay][subTargetIdx];
    if(!ex.subs)ex.subs=[];
    ex.subs.push(name);
    dbSet('split',split);
    closeModal();
    showToast('Substitute added');
    renderWorkout();
    return;
  }
  const ex={name,sets:parseInt(document.getElementById('newSets').value)||3,reps:document.getElementById('newReps').value.trim()||'8-12',subs:[]};
  split[currentDay].push(ex);
  getExData(currentDay,ex.name,ex.sets);
  dbSet('split',split);
  closeModal();
  showToast(name+' added');
  renderWorkout();
}

function resetDay(){
  askConfirm('Reset all sets for '+currentDay+'?',()=>{
    (split[currentDay]||[]).forEach(ex=>{
      const ed=getExData(currentDay,ex.name,ex.sets);
      ed.sets=ed.sets.map(s=>({weight:s.weight||'',reps:'',done:false}));
    });
    debounceSave();
    showToast('Day reset');
    renderWorkout();
  });
}

async function finishWorkout(){
  const today=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const todayISO=new Date().toISOString().slice(0,10);
  let anyDone=false;
  (split[currentDay]||[]).forEach(ex=>{
    const ed=getExData(currentDay,ex.name,ex.sets);
    const doneCount=ed.sets.filter(s=>s.done).length;
    if(doneCount>0){
      anyDone=true;
      if(!ed.history)ed.history=[];
      ed.history.push({
        date:today,
        weight:topWeight(ed)||0,
        sets:doneCount,
        allCompleted:doneCount===ex.sets,
        detail:ed.sets.map(s=>({weight:s.weight||'',reps:s.reps||'',done:s.done})),
        volume:ed.sets.reduce((a,s)=>a+(s.done?(parseFloat(s.weight)||0)*(parseInt(s.reps)||0):0),0)
      });
      if(ed.history.length>10)ed.history.shift();
    }
  });
  if(!anyDone){showToast('Check off some sets first');return;}

  // Auto progression: top of range on all sets → +5lb immediately
  const progressed=evaluateProgression(currentDay);

  // Log the workout date for the calendar
  if(!workoutDates.includes(todayISO))workoutDates.push(todayISO);

  // Log into weekly history
  let weekEntry=historyLog.find(h=>h.week===currentWeek);
  if(!weekEntry){weekEntry={week:currentWeek,weekStart,days:[]};historyLog.unshift(weekEntry);}
  const dayLog={day:currentDay,date:today,exercises:[]};
  (split[currentDay]||[]).forEach(ex=>{
    const ed=getExData(currentDay,ex.name,ex.sets);
    const doneCount=ed.sets.filter(s=>s.done).length;
    if(doneCount>0){
      dayLog.exercises.push({
        name:ex.name,
        weight:topWeight(ed)||0,
        setsDone:doneCount,
        totalSets:ex.sets,
        allHit:doneCount===ex.sets,
        detail:ed.sets.filter(s=>s.done).map(s=>({weight:s.weight||'',reps:s.reps||''}))
      });
    }
  });
  const existing=weekEntry.days.findIndex(d=>d.day===currentDay);
  if(existing>=0)weekEntry.days[existing]=dayLog;
  else weekEntry.days.push(dayLog);

  stopRest();
  await saveAll();
  showToast(progressed.length>0?'✓ Saved! +5lb on '+progressed.length+' lift'+(progressed.length>1?'s':'')+' 🔺':'✓ Workout saved!');
  renderWorkout();
  renderHistory();
  renderCalendar();
}

// ── BODY / RECOMP TRACKER ─────────────────────────────────────
let GOAL_WEIGHT=parseFloat(localStorage.getItem('ol_goal_'+PROFILE))||190;
function setGoal(){
  askText('GOAL WEIGHT (LB)',GOAL_WEIGHT,(v)=>{
    const n=parseFloat(v);
    if(isNaN(n)||n<60||n>500){showToast('Enter a realistic number');return;}
    GOAL_WEIGHT=n;
    localStorage.setItem('ol_goal_'+PROFILE,String(n));
    renderBody();
  });
}

function renderBody(){
  const el=document.getElementById('bodyMain');
  if(!el)return;
  const sorted=[...bodyLog].sort((a,b)=>a.date<b.date?1:-1);
  const latest=sorted[0];
  const cur=latest?parseFloat(latest.weight):null;
  const start=bodyLog.length?parseFloat([...bodyLog].sort((a,b)=>a.date<b.date?-1:1)[0].weight):null;

  // progress from starting weight toward the 190 goal
  let pct=0;
  if(cur!==null&&start!==null&&GOAL_WEIGHT!==start){
    pct=Math.max(0,Math.min(100,((cur-start)/(GOAL_WEIGHT-start))*100));
  }
  const toGo=cur!==null?(GOAL_WEIGHT-cur).toFixed(1):'—';

  // 7-day and 30-day trend
  const trend=(days)=>{
    if(sorted.length<2)return null;
    const cutoff=new Date(Date.now()-days*864e5).toISOString().slice(0,10);
    const older=sorted.find(e=>e.date<=cutoff)||sorted[sorted.length-1];
    if(!older||older===latest)return null;
    return (parseFloat(latest.weight)-parseFloat(older.weight)).toFixed(1);
  };
  const t7=trend(7), t30=trend(30);
  const arrow=v=>v===null?'':(parseFloat(v)>0?'▲ +':(parseFloat(v)<0?'▼ ':'– '));

  let html=`
    <div class="day-title">BODY</div>
    <div class="day-sub" onclick="setGoal()" style="cursor:pointer">GOAL → ${GOAL_WEIGHT} LB &nbsp;<span style="color:var(--accent)">EDIT</span></div>
    <div class="bw-hero">
      <div><span class="bw-now">${cur!==null?cur:'—'}</span><span class="bw-unit">LB${latest&&latest.bf?'  ·  '+latest.bf+'% BF':''}</span></div>
      <div class="bw-goalbar"><div class="bw-goalfill" style="width:${pct}%"></div></div>
      <div class="bw-ends"><span>${start!==null?start+' lb start':'log to begin'}</span><span>${cur!==null?toGo+' lb to go':GOAL_WEIGHT+' lb'}</span></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-val">${t7!==null?arrow(t7)+Math.abs(t7):'—'}</div><div class="stat-label">7 DAY LB</div></div>
      <div class="stat"><div class="stat-val">${t30!==null?arrow(t30)+Math.abs(t30):'—'}</div><div class="stat-label">30 DAY LB</div></div>
      <div class="stat"><div class="stat-val">${bodyLog.length}</div><div class="stat-label">ENTRIES</div></div>
    </div>
    <div class="input-label">Log today</div>
    <div class="bw-form">
      <input class="bw-in" id="bwW" type="number" step="0.1" placeholder="lb">
      <input class="bw-in" id="bwF" type="number" step="0.1" placeholder="% bf">
      <button class="bw-log-btn" onclick="logBody()">LOG</button>
    </div>
    ${sparkline(sorted)}
    ${sorted.map(e=>`
      <div class="bw-row">
        <div>
          <span class="bw-row-w">${e.weight} lb</span>
          ${e.bf?`<span class="bw-row-bf">${e.bf}% bf</span>`:''}
        </div>
        <div style="display:flex;align-items:center">
          <span class="bw-row-d">${e.date}</span>
          <button class="bw-del" onclick="delBody('${e.date}')">✕</button>
        </div>
      </div>`).join('')}
    ${sorted.length===0?'<div style="color:#555;font-size:13px;text-align:center;padding:24px">Weigh in a few mornings a week — same time, before food. The trend line matters, not any single day.</div>':''}`;
  el.innerHTML=html;
}

function sparkline(sorted){
  if(sorted.length<2)return '';
  const pts=[...sorted].reverse().map(e=>parseFloat(e.weight)).filter(n=>!isNaN(n));
  if(pts.length<2)return '';
  const mn=Math.min(...pts,GOAL_WEIGHT), mx=Math.max(...pts,GOAL_WEIGHT);
  const rng=(mx-mn)||1, W=320, H=80;
  const coords=pts.map((v,i)=>{
    const x=(i/(pts.length-1))*W;
    const y=H-((v-mn)/rng)*H;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  const goalY=(H-((GOAL_WEIGHT-mn)/rng)*H).toFixed(1);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="0" y1="${goalY}" x2="${W}" y2="${goalY}" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="5,5" opacity=".7"/>
    <polyline points="${coords}" fill="none" stroke="#e83535" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function logBody(){
  const w=document.getElementById('bwW').value;
  const bf=document.getElementById('bwF').value;
  if(!w){showToast('Enter a weight');return;}
  const date=new Date().toISOString().slice(0,10);
  const i=bodyLog.findIndex(e=>e.date===date);
  const entry={date,weight:parseFloat(w),bf:bf?parseFloat(bf):null};
  if(i>=0)bodyLog[i]=entry; else bodyLog.push(entry);
  dbSet('bodyLog',bodyLog);
  renderBody();
  showToast('Logged '+w+' lb');
}
function delBody(date){
  bodyLog=bodyLog.filter(e=>e.date!==date);
  dbSet('bodyLog',bodyLog);
  renderBody();
}

// ── CALENDAR ──────────────────────────────────────────────────
function renderCalendar(){
  const monthNames=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const todayISO=new Date().toISOString().slice(0,10);

  // Count workouts this month & week
  const monthWorkouts=workoutDates.filter(d=>{
    const dd=new Date(d);
    return dd.getMonth()===calMonth&&dd.getFullYear()===calYear;
  }).length;
  const now=new Date();
  const weekAgo=new Date(now);weekAgo.setDate(now.getDate()-7);
  const weekWorkouts=workoutDates.filter(d=>new Date(d)>=weekAgo).length;

  let html=`
    <div class="cal-header">
      <div class="cal-month">${monthNames[calMonth]} ${calYear}</div>
      <div class="cal-nav">
        <button onclick="calNav(-1)">‹</button>
        <button onclick="calNav(1)">›</button>
      </div>
    </div>
    <div class="cal-grid">
      ${['S','M','T','W','T','F','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${Array(firstDay).fill('<div class="cal-day"></div>').join('')}
      ${Array.from({length:daysInMonth},(_, i)=>{
        const dayNum=i+1;
        const iso=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
        const worked=workoutDates.includes(iso);
        const isToday=iso===todayISO;
        return `<div class="cal-day in-month ${worked?'worked':''} ${isToday?'today':''}">${dayNum}</div>`;
      }).join('')}
    </div>
    <div class="cal-stats">
      <div class="stat" style="flex:1"><div class="stat-val">${weekWorkouts}</div><div class="stat-label">LAST 7 DAYS</div></div>
      <div class="stat" style="flex:1"><div class="stat-val">${monthWorkouts}</div><div class="stat-label">THIS MONTH</div></div>
      <div class="stat" style="flex:1"><div class="stat-val">${workoutDates.length}</div><div class="stat-label">ALL TIME</div></div>
    </div>`;
  document.getElementById('calendarMain').innerHTML=html;
}
function calNav(dir){
  calMonth+=dir;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  renderCalendar();
}

// ── HISTORY ───────────────────────────────────────────────────
function renderHistory(){
  if(!historyLog||historyLog.length===0){
    document.getElementById('historyMain').innerHTML='<div class="empty">No workouts saved yet.<br>Finish a workout to see history.</div>';
    return;
  }
  document.getElementById('historyMain').innerHTML=historyLog.map(wk=>`
    <div class="hist-week" id="hw${wk.week}">
      <div class="hist-week-hdr" onclick="toggleHW(${wk.week})">
        <div class="hist-week-title">WEEK ${wk.week}</div>
        <div class="hist-week-sub">${wk.days.length} sessions</div>
      </div>
      <div class="hist-week-body">
        ${wk.days.map(d=>`
          <div class="hist-day">
            <div class="hist-day-title">${d.day} · ${d.date||''}</div>
            ${d.exercises.map(ex=>`
              <div class="hist-ex-row">
                <div class="hist-ex-top">
                  <div class="hist-ex-name">${ex.name}</div>
                  <div class="hist-ex-stat">${ex.weight}lb · ${ex.setsDone||ex.sets}/${ex.totalSets} ${ex.allHit?'✓':''}</div>
                </div>
                ${ex.detail&&ex.detail.length?`<div class="hist-ex-detail">${ex.detail.map(p=>`${p.weight||'—'}×${p.reps||'—'}`).join('  ')}</div>`:''}
              </div>`).join('')}
          </div>`).join('')}
      </div>
    </div>`).join('');
}
function toggleHW(wk){document.getElementById('hw'+wk).classList.toggle('open');}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ── BOOT ──────────────────────────────────────────────────────
async function boot(){
  const profiles=(await rawGet('_profiles'))||[];
  window._allProfiles=profiles;
  if(PROFILE && profiles.includes(PROFILE)){
    document.getElementById('loginScreen').classList.remove('on');
    document.getElementById('profBadge').textContent=PROFILE;
    init();
    return;
  }
  // no profile on this device yet — show the picker
  PROFILE=null;
  const list=document.getElementById('profileList');
  list.innerHTML = profiles.length
    ? profiles.map(p=>`<div class="prof-chip" onclick="pickProfile('${p.replace(/'/g,"\\'")}')"><span class="prof-name">${p}</span><span class="prof-go">CONTINUE →</span></div>`).join('')
      + '<div class="login-or">OR ADD SOMEONE NEW</div>'
    : '';
  document.getElementById('loginScreen').classList.add('on');
}

async function pickProfile(name){
  PROFILE=name;
  localStorage.setItem('ol_profile',name);
  document.getElementById('loginScreen').classList.remove('on');
  document.getElementById('profBadge').textContent=name;
  GOAL_WEIGHT=parseFloat(localStorage.getItem('ol_goal_'+name))||190;
  await init();
}

async function createProfile(){
  const raw=document.getElementById('newProfile').value.trim();
  if(!raw){showToast('Enter a name');return;}
  const name=raw.toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!name){showToast('Letters and numbers only');return;}
  let profiles=(await rawGet('_profiles'))||[];
  if(profiles.includes(name)){ await pickProfile(name); return; }

  // FIRST EVER profile inherits any legacy un-namespaced data (Bobby's original log)
  if(profiles.length===0){
    for(const k of ['split','workoutData','historyLog','workoutDates','currentWeek','weekStart','bodyLog']){
      const legacy=await rawGet(k);
      if(legacy!==null && legacy!==undefined) await rawSet(name+':'+k, legacy);
    }
  }
  profiles.push(name);
  await rawSet('_profiles',profiles);
  if(profiles.length===1){
    // very first profile on a fresh deployment — load Bobby's current numbers
    PROFILE=name;
    split=JSON.parse(JSON.stringify(DEFAULT_SPLIT));
    applySeedWeights();
    await dbSet('split',split);
    await dbSet('workoutData',workoutData);
    PROFILE=null;
  }
  await pickProfile(name);
}

async function switchProfile(){
  askConfirm('Switch to a different person? Your log stays saved.',()=>{
    localStorage.removeItem('ol_profile');
    PROFILE=null;
    // wipe in-memory state so nothing bleeds across
    workoutData={}; historyLog=[]; workoutDates=[]; bodyLog=[]; currentWeek=1;
    split=JSON.parse(JSON.stringify(DEFAULT_SPLIT));
    stopRest();
    boot();
  });
}

boot();

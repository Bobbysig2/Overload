<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overload">
<title>Overload</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a; --surface: #141414; --border: #1e1e1e;
    --accent: #e83535; --text: #f0f0f0; --muted: #555;
    --green: #4ade80; --orange: #ff6b35;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  ::-webkit-scrollbar { display: none; }
  .header { padding: 20px 20px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg); z-index: 100; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 3px; color: var(--accent); }
  .week-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); border: 1px solid var(--border); padding: 4px 12px; border-radius: 20px; }
  .nav-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .nav-tab { flex: 1; padding: 12px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); cursor: pointer; letter-spacing: 1px; text-transform: uppercase; border-bottom: 2px solid transparent; }
  .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .page { display: none; }
  .page.active { display: block; }
  .day-tabs { display: flex; gap: 8px; padding: 14px 20px; overflow-x: auto; border-bottom: 1px solid var(--border); }
  .day-tab { flex-shrink: 0; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .day-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
  .main { padding: 20px 20px 110px; }
  .day-title { font-family: 'Bebas Neue', sans-serif; font-size: 44px; letter-spacing: 2px; line-height: 1; }
  .day-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 4px; margin-bottom: 20px; }
  .stats { display: flex; gap: 10px; margin-bottom: 22px; }
  .stat { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 8px; text-align: center; }
  .stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--accent); line-height: 1; }
  .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted); margin-top: 3px; letter-spacing: 1px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .card.all-done { border-color: var(--green); opacity: 0.75; }
  .card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px; cursor: pointer; user-select: none; }
  .card-name { font-size: 15px; font-weight: 600; }
  .card-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 2px; }
  .card-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .wt-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 4px; }
  .del-btn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid #2a1010; background: transparent; color: #f87171; font-size: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .chevron { color: var(--muted); font-size: 10px; display: inline-block; transition: transform 0.2s; }
  .card-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
  .card.open .card-body { display: block; }
  .card.open .chevron { transform: rotate(180deg); }
  .prog-bar { background: var(--border); border-radius: 4px; height: 3px; margin: 10px 0 14px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.3s; }
  .prog-hint { background: #1a2a1a; border: 1px solid #2a4a2a; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .prog-hint-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--green); }
  .input-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
  .weight-row { margin-bottom: 14px; }
  .weight-input { width: 100px; background: var(--bg); border: 1px solid #2a2a2a; border-radius: 6px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; padding: 8px 12px; outline: none; }
  .sets-hdr { display: grid; grid-template-columns: 24px 1fr 80px 32px; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #444; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .set-row { display: grid; grid-template-columns: 24px 1fr 80px 32px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .set-num { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #444; text-align: center; }
  .set-target { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }
  .reps-input { background: var(--bg); border: 1px solid #2a2a2a; border-radius: 6px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; padding: 7px 8px; outline: none; text-align: center; width: 100%; }
  .check-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid #2a2a2a; background: transparent; color: transparent; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto; cursor: pointer; }
  .check-btn.done { border-color: var(--green); background: var(--green); color: #000; }
  .last-session { margin-top: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
  .last-wt { font-family: 'Bebas Neue', sans-serif; font-size: 18px; }
  .last-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #444; margin-top: 2px; }
  .last-date { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #444; }
  .add-ex-btn { width: 100%; padding: 14px; border-radius: 12px; border: 1px dashed #2a2a2a; background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 12px; }
  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 14px 20px; background: var(--bg); border-top: 1px solid var(--border); display: flex; gap: 10px; z-index: 50; }
  .btn { padding: 14px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; border: none; }
  .btn-sec { flex: 1; background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-pri { flex: 2; background: var(--accent); color: #fff; }
  .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-8px); background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; padding: 10px 22px; border-radius: 30px; z-index: 999; white-space: nowrap; opacity: 0; transition: all 0.25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid #2a2a2a; border-radius: 16px 16px 0 0; padding: 24px 20px 44px; width: 100%; max-width: 600px; }
  .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; margin-bottom: 16px; }
  .modal-input { width: 100%; background: var(--bg); border: 1px solid #2a2a2a; border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 12px 14px; outline: none; margin-bottom: 10px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .hist-week { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .hist-week-hdr { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .hist-week-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; }
  .hist-week-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); }
  .hist-week-body { display: none; border-top: 1px solid var(--border); }
  .hist-week.open .hist-week-body { display: block; }
  .hist-day { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .hist-day:last-child { border-bottom: none; }
  .hist-day-title { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; }
  .hist-ex-row { display: flex; justify-content: space-between; padding: 3px 0; }
  .hist-ex-name { font-size: 12px; }
  .hist-ex-stat { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }
  .empty { text-align: center; padding: 60px 20px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); line-height: 2; }
  .loading { display: flex; align-items: center; justify-content: center; min-height: 50vh; flex-direction: column; gap: 12px; }
  .spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); letter-spacing: 2px; }
  .save-indicator { position: fixed; top: 16px; right: 70px; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); z-index: 200; transition: background 0.3s; }
  .save-indicator.saving { background: var(--orange); }
  .save-indicator.saved { background: var(--green); }
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<div class="save-indicator" id="saveIndicator"></div>

<div class="header">
  <div class="logo">OVERLOAD</div>
  <div class="week-badge" id="weekBadge">WEEK 1</div>
</div>
<div class="nav-tabs">
  <div class="nav-tab active" id="nav-workout" onclick="switchNav('workout')">WORKOUT</div>
  <div class="nav-tab" id="nav-history" onclick="switchNav('history')">HISTORY</div>
</div>
<div class="page active" id="page-workout">
  <div class="day-tabs" id="dayTabs"></div>
  <div class="main" id="workoutMain">
    <div class="loading"><div class="spinner"></div><div class="loading-text">LOADING...</div></div>
  </div>
</div>
<div class="page" id="page-history">
  <div class="main" id="historyMain">
    <div class="empty">No workouts saved yet.<br>Finish a workout to see history.</div>
  </div>
</div>
<div class="bottom-bar" id="bottomBar">
  <button class="btn btn-sec" onclick="resetDay()">RESET</button>
  <button class="btn btn-pri" onclick="finishWorkout()">FINISH WORKOUT</button>
</div>
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-title">ADD EXERCISE</div>
    <input class="modal-input" id="newName" placeholder="Exercise name" />
    <input class="modal-input" id="newSets" type="number" placeholder="Sets (e.g. 3)" />
    <input class="modal-input" id="newReps" placeholder="Reps (e.g. 8-12)" />
    <div class="modal-actions">
      <button class="btn btn-sec" style="flex:1" onclick="closeModal()">CANCEL</button>
      <button class="btn btn-pri" style="flex:2" onclick="confirmAdd()">ADD</button>
    </div>
  </div>
</div>

<script>
// ── SUPABASE CONFIG ───────────────────────────────────────────
const SUPABASE_URL = 'https://bftjbjfemtynovxwzeyz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmdGpiamZlbXR5bm92eHd6ZXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMDk0NjAsImV4cCI6MjA5Nzc4NTQ2MH0.2XgOxzK6tCkbxDY8i7-hYuwQgOBp67wuqk3usCCHzh0';
const HEADERS = { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

async function dbGet(key) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/workout_data?key=eq.${key}&select=value`, { headers: HEADERS });
    const rows = await res.json();
    if (rows && rows.length > 0) return JSON.parse(rows[0].value);
  } catch(e) {}
  // fallback localStorage
  const v = localStorage.getItem('ol_' + key);
  return v ? JSON.parse(v) : null;
}

async function dbSet(key, value) {
  // Always save localStorage first as backup
  localStorage.setItem('ol_' + key, JSON.stringify(value));
  setSaveIndicator('saving');
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/workout_data?key=eq.${key}`, { headers: HEADERS });
    const rows = await res.json();
    if (rows && rows.length > 0) {
      await fetch(`${SUPABASE_URL}/rest/v1/workout_data?key=eq.${key}`, {
        method: 'PATCH',
        headers: { ...HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ value: JSON.stringify(value), updated_at: new Date().toISOString() })
      });
    } else {
      await fetch(`${SUPABASE_URL}/rest/v1/workout_data`, {
        method: 'POST',
        headers: { ...HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ key, value: JSON.stringify(value), updated_at: new Date().toISOString() })
      });
    }
    setSaveIndicator('saved');
  } catch(e) {
    setSaveIndicator('saved');
  }
}

function setSaveIndicator(state) {
  const el = document.getElementById('saveIndicator');
  el.className = 'save-indicator ' + state;
  if (state === 'saved') setTimeout(() => el.className = 'save-indicator', 2000);
}

// ── SPLIT ─────────────────────────────────────────────────────
const DEFAULT_SPLIT = {
  "Upper A": [
    {name:"Cable Crossover Mid",sets:2,reps:"10-15"},
    {name:"Cable Crossover High",sets:2,reps:"10-15"},
    {name:"Pec Dec",sets:3,reps:"10-15"},
    {name:"Lat Pulldown",sets:3,reps:"8-12"},
    {name:"Concentration Curl",sets:3,reps:"10-12"},
    {name:"Bayesian Curl",sets:3,reps:"10-12"},
    {name:"Tricep Pulldown",sets:3,reps:"10-12"},
    {name:"Lateral Raise",sets:3,reps:"15-20"},
  ],
  "Upper B": [
    {name:"Incline DB Press",sets:3,reps:"8-12"},
    {name:"Shoulder DB Press",sets:3,reps:"8-12"},
    {name:"Y Raise",sets:3,reps:"12-15"},
    {name:"Seated Row",sets:3,reps:"8-12"},
    {name:"Incline DB Curl",sets:3,reps:"10-12"},
    {name:"Overhead Tricep",sets:3,reps:"10-12"},
  ],
  "Upper C": [
    {name:"Rear Delt Fly",sets:3,reps:"15-20"},
    {name:"Weighted Pull Up",sets:4,reps:"5-8"},
    {name:"Machine Back Row",sets:3,reps:"8-12"},
    {name:"Tricep Cross Cable Curl",sets:3,reps:"10-12"},
    {name:"Hammer Curl",sets:3,reps:"10-12"},
    {name:"Preacher Curl",sets:3,reps:"10-12"},
    {name:"Low Cable Cross",sets:3,reps:"12-15"},
  ],
  "Lower A": [
    {name:"Back Squat",sets:4,reps:"5-6"},
    {name:"Back Squat with Box",sets:3,reps:"6-8"},
    {name:"RDL",sets:4,reps:"8-10"},
    {name:"Calf Raise",sets:4,reps:"15-20"},
    {name:"Leg Extensions",sets:3,reps:"12-15"},
    {name:"Ab Crunch",sets:3,reps:"15-20"},
  ],
  "Lower B": [
    {name:"Bulgarian Split Squat",sets:4,reps:"8-10"},
    {name:"Hamstring Curl",sets:3,reps:"12-15"},
    {name:"Calf Raise",sets:4,reps:"15-20"},
    {name:"Dips",sets:3,reps:"8-12"},
    {name:"Pull Ups",sets:4,reps:"6-10"},
    {name:"Dumbbell Shrug",sets:3,reps:"12-15"},
  ],
};

const DAYS = Object.keys(DEFAULT_SPLIT);
let split = JSON.parse(JSON.stringify(DEFAULT_SPLIT));
let workoutData = {};
let historyLog = [];
let currentWeek = 1;
let weekStart = getThisSunday();
let currentDay = DAYS[0];
let openCards = {};
let saveTimer = null;

// ── WEEK LOGIC ────────────────────────────────────────────────
function getThisSunday() {
  const d = new Date();
  d.setDate(d.getDate() - d.getDay());
  d.setHours(0,0,0,0);
  return d.getTime();
}

function checkWeekReset() {
  const thisSunday = getThisSunday();
  if (thisSunday > weekStart) {
    archiveWeek();
    const elapsed = Math.round((thisSunday - weekStart) / (7*24*60*60*1000));
    currentWeek += elapsed;
    weekStart = thisSunday;
    resetAllSets();
    applyProgression();
    saveAll();
    showToast('🗓 New week — weights updated!');
  }
  document.getElementById('weekBadge').textContent = 'WEEK ' + currentWeek;
}

function archiveWeek() {
  const entry = {week: currentWeek, weekStart, days: []};
  DAYS.forEach(day => {
    const exs = [];
    (split[day]||[]).forEach(ex => {
      const ed = (workoutData[day]||{})[ex.name];
      if (ed && ed.sets && ed.sets.some(s=>s.done)) {
        exs.push({
          name: ex.name,
          weight: ed.weight||0,
          setsDone: ed.sets.filter(s=>s.done).length,
          totalSets: ex.sets,
          allHit: ed.sets.every(s=>s.done),
        });
      }
    });
    if (exs.length > 0) entry.days.push({day, exercises: exs});
  });
  if (entry.days.length > 0) {
    historyLog.unshift(entry);
    if (historyLog.length > 52) historyLog.pop();
  }
}

function resetAllSets() {
  DAYS.forEach(day => {
    if (!workoutData[day]) workoutData[day] = {};
    (split[day]||[]).forEach(ex => {
      if (workoutData[day][ex.name]) {
        workoutData[day][ex.name].sets = makeSets(ex.sets);
        workoutData[day][ex.name].progressedThisWeek = false;
      }
    });
  });
}

function applyProgression() {
  if (!historyLog.length) return;
  historyLog[0].days.forEach(dayLog => {
    dayLog.exercises.forEach(exLog => {
      if (!exLog.allHit) return;
      if (!workoutData[dayLog.day]) workoutData[dayLog.day] = {};
      if (!workoutData[dayLog.day][exLog.name]) {
        workoutData[dayLog.day][exLog.name] = {weight: exLog.weight, sets: [], history: []};
      }
      const ed = workoutData[dayLog.day][exLog.name];
      ed.weight = (parseFloat(ed.weight || exLog.weight || 0) + 2.5).toFixed(1);
      ed.progressedThisWeek = true;
    });
  });
}

// ── DATA ──────────────────────────────────────────────────────
function makeSets(n) { return Array.from({length:n}, ()=>({reps:'', done:false})); }

function getExData(day, name, numSets) {
  if (!workoutData[day]) workoutData[day] = {};
  if (!workoutData[day][name]) workoutData[day][name] = {weight:'', sets:makeSets(numSets), history:[]};
  const ed = workoutData[day][name];
  while (ed.sets.length < numSets) ed.sets.push({reps:'', done:false});
  return ed;
}

function debounceSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => dbSet('workoutData', workoutData), 800);
}

async function saveAll() {
  await Promise.all([
    dbSet('split', split),
    dbSet('workoutData', workoutData),
    dbSet('historyLog', historyLog),
    dbSet('currentWeek', currentWeek),
    dbSet('weekStart', weekStart),
  ]);
}

// ── INIT ──────────────────────────────────────────────────────
async function init() {
  const [sp, wd, hl, wk, ws] = await Promise.all([
    dbGet('split'),
    dbGet('workoutData'),
    dbGet('historyLog'),
    dbGet('currentWeek'),
    dbGet('weekStart'),
  ]);
  if (sp) split = sp;
  if (wd) workoutData = wd;
  if (hl) historyLog = hl;
  if (wk) currentWeek = wk;
  if (ws) weekStart = ws;
  checkWeekReset();
  renderTabs();
  renderWorkout();
  renderHistory();
}

// ── NAV ───────────────────────────────────────────────────────
function switchNav(nav) {
  ['workout','history'].forEach(n => {
    document.getElementById('page-'+n).classList.toggle('active', n===nav);
    document.getElementById('nav-'+n).classList.toggle('active', n===nav);
  });
  document.getElementById('bottomBar').style.display = nav==='workout' ? 'flex' : 'none';
  if (nav==='history') renderHistory();
}

function renderTabs() {
  document.getElementById('dayTabs').innerHTML = DAYS.map(d =>
    `<button class="day-tab ${d===currentDay?'active':''}" onclick="switchDay('${d}')">${d}</button>`
  ).join('');
}

function switchDay(day) { currentDay=day; renderTabs(); renderWorkout(); }

// ── RENDER ────────────────────────────────────────────────────
function renderWorkout() {
  const exercises = split[currentDay]||[];
  const allED = exercises.map(ex => getExData(currentDay, ex.name, ex.sets));
  const totalSets = exercises.reduce((a,ex)=>a+ex.sets, 0);
  const doneSets = allED.reduce((a,ed)=>a+ed.sets.filter(s=>s.done).length, 0);
  const doneEx = allED.filter(ed=>ed.sets.length>0&&ed.sets.every(s=>s.done)).length;
  const pct = totalSets>0 ? Math.round((doneSets/totalSets)*100) : 0;

  let html = `
    <div class="day-title">${currentDay}</div>
    <div class="day-sub">${exercises.length} EXERCISES · ${totalSets} SETS</div>
    <div class="stats">
      <div class="stat"><div class="stat-val">${doneEx}/${exercises.length}</div><div class="stat-label">EXERCISES</div></div>
      <div class="stat"><div class="stat-val">${doneSets}/${totalSets}</div><div class="stat-label">SETS</div></div>
      <div class="stat"><div class="stat-val">${pct}%</div><div class="stat-label">DONE</div></div>
    </div>`;

  exercises.forEach((ex, i) => {
    const ed = allED[i];
    const allDone = ed.sets.length>0 && ed.sets.every(s=>s.done);
    const setsDone = ed.sets.filter(s=>s.done).length;
    const isOpen = openCards[currentDay+ex.name] !== false;
    const lastH = ed.history&&ed.history.length>0 ? ed.history[ed.history.length-1] : null;

    html += `
      <div class="card ${allDone?'all-done':''} ${isOpen?'open':''}" id="card${i}">
        <div class="card-header" onclick="toggleCard(${i},'${esc(ex.name)}')">
          <div style="flex:1;min-width:0">
            <div class="card-name" style="color:${allDone?'var(--green)':'var(--text)'}">${allDone?'✓ ':''}${ex.name}</div>
            <div class="card-meta">${ex.sets} × ${ex.reps}</div>
          </div>
          <div class="card-right">
            ${ed.weight ? `<span class="wt-badge">${ed.weight}kg</span>` : ''}
            <button class="del-btn" onclick="event.stopPropagation();deleteEx(${i})">✕</button>
            <span class="chevron">▼</span>
          </div>
        </div>
        <div class="card-body">
          <div class="prog-bar"><div class="prog-fill" style="width:${ex.sets>0?(setsDone/ex.sets)*100:0}%"></div></div>
          ${ed.progressedThisWeek ? `<div class="prog-hint"><span style="font-size:16px">🔺</span><span class="prog-hint-text">+2.5kg added — you hit all sets last week!</span></div>` : ''}
          <div class="weight-row">
            <div class="input-label">Weight (kg)</div>
            <input class="weight-input" type="number" step="0.5" value="${ed.weight||''}" placeholder="0"
              oninput="updateWeight('${esc(ex.name)}',this.value)">
          </div>
          <div class="sets-hdr"><div>#</div><div>TARGET</div><div style="text-align:center">REPS</div><div style="text-align:center">✓</div></div>
          ${ed.sets.map((set,si) => `
            <div class="set-row">
              <div class="set-num">${si+1}</div>
              <div class="set-target">${ex.reps}</div>
              <input class="reps-input" type="number" value="${set.reps||''}" placeholder="—"
                oninput="updateReps('${esc(ex.name)}',${si},this.value)">
              <button class="check-btn ${set.done?'done':''}" onclick="toggleSet('${esc(ex.name)}',${si})">✓</button>
            </div>`).join('')}
          ${lastH ? `
            <div class="last-session">
              <div><div class="last-wt">${lastH.weight}kg</div><div class="last-meta">${lastH.sets} sets done</div></div>
              <div class="last-date">${lastH.date}</div>
            </div>` : ''}
        </div>
      </div>`;
  });

  html += `<button class="add-ex-btn" onclick="openModal()">+ Add Exercise</button>`;
  document.getElementById('workoutMain').innerHTML = html;
}

function esc(s) { return s.replace(/'/g,"\\'"); }

function toggleCard(i, name) {
  const key = currentDay+name;
  openCards[key] = openCards[key]===false ? true : false;
  document.getElementById('card'+i).classList.toggle('open');
}

function updateWeight(name, val) {
  getExData(currentDay, name, 3).weight = val;
  debounceSave();
}

function updateReps(name, si, val) {
  getExData(currentDay, name, 3).sets[si].reps = val;
  debounceSave();
}

function toggleSet(name, si) {
  const ed = getExData(currentDay, name, 3);
  ed.sets[si].done = !ed.sets[si].done;
  debounceSave();
  renderWorkout();
}

function deleteEx(idx) {
  const name = split[currentDay][idx].name;
  if (!confirm('Remove "'+name+'" from '+currentDay+'?')) return;
  split[currentDay].splice(idx, 1);
  dbSet('split', split);
  showToast(name+' removed');
  renderWorkout();
}

function openModal() {
  ['newName','newSets','newReps'].forEach(id => document.getElementById(id).value='');
  document.getElementById('addModal').classList.add('open');
  setTimeout(() => document.getElementById('newName').focus(), 100);
}
function closeModal() { document.getElementById('addModal').classList.remove('open'); }

function confirmAdd() {
  const name = document.getElementById('newName').value.trim();
  if (!name) return;
  const ex = {name, sets: parseInt(document.getElementById('newSets').value)||3, reps: document.getElementById('newReps').value.trim()||'8-12'};
  split[currentDay].push(ex);
  getExData(currentDay, ex.name, ex.sets);
  dbSet('split', split);
  closeModal();
  showToast(name+' added');
  renderWorkout();
}

function resetDay() {
  if (!confirm('Reset all sets for '+currentDay+'?')) return;
  (split[currentDay]||[]).forEach(ex => {
    const ed = getExData(currentDay, ex.name, ex.sets);
    ed.sets = makeSets(ex.sets);
  });
  debounceSave();
  showToast('Day reset');
  renderWorkout();
}

async function finishWorkout() {
  const today = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
  (split[currentDay]||[]).forEach(ex => {
    const ed = getExData(currentDay, ex.name, ex.sets);
    const doneCount = ed.sets.filter(s=>s.done).length;
    if (doneCount > 0) {
      if (!ed.history) ed.history = [];
      ed.history.push({date:today, weight:ed.weight||0, sets:doneCount, allCompleted:doneCount===ex.sets});
      if (ed.history.length > 10) ed.history.shift();
    }
  });
  await dbSet('workoutData', workoutData);
  showToast('✓ Saved!');
  renderWorkout();
}

// ── HISTORY ───────────────────────────────────────────────────
function renderHistory() {
  if (!historyLog||historyLog.length===0) {
    document.getElementById('historyMain').innerHTML = '<div class="empty">No workouts saved yet.<br>Finish a workout to see history.</div>';
    return;
  }
  document.getElementById('historyMain').innerHTML = historyLog.map(wk => `
    <div class="hist-week" id="hw${wk.week}">
      <div class="hist-week-hdr" onclick="toggleHW(${wk.week})">
        <div class="hist-week-title">WEEK ${wk.week}</div>
        <div class="hist-week-sub">${wk.days.length} sessions</div>
      </div>
      <div class="hist-week-body">
        ${wk.days.map(d => `
          <div class="hist-day">
            <div class="hist-day-title">${d.day}</div>
            ${d.exercises.map(ex => `
              <div class="hist-ex-row">
                <div class="hist-ex-name">${ex.name}</div>
                <div class="hist-ex-stat">${ex.weight}kg · ${ex.setsDone}/${ex.totalSets} ${ex.allHit?'✓':''}</div>
              </div>`).join('')}
          </div>`).join('')}
      </div>
    </div>`).join('');
}

function toggleHW(wk) { document.getElementById('hw'+wk).classList.toggle('open'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
